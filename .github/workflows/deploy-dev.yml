name: Deploy to Dev

on:

  push:
    branches:
      - develop

  workflow_dispatch:
    inputs:

      correlation_id:
        description: Unique identifier attached to workflow dispatch
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

permissions:
  contents: read

  packages: write

jobs:

  log-correlation-id:

    name: Print Correlation ID

    runs-on: ubuntu-latest

    steps:

      - name: Log Correlation ID

        run: |
          echo "Correlation ID: ${{ github.event.inputs.correlation_id }}"

  build-and-publish:

    name: Build and Publish Containers

    needs: [log-correlation-id]

    uses: ./.github/workflows/container-build-azure.yml

    with:

      ENVIRONMENT: dev

      BUILD_CONTEXT: >
        [
          {
            "path": ".",
            "image": "api",
            "dockerfile": "Dockerfile.api"
          },
          {
            "path": ".",
            "image": "web",
            "dockerfile": "Dockerfile.web"
          }
        ]

      TAG_NAME: ${{ format('dev-{0}', github.sha) }}

    secrets: inherit

  deploy-to-azure:

    name: Deploy Multi Container App

    runs-on: ubuntu-latest

    needs: [build-and-publish]

    env:
      TAG_NAME: ${{ format('dev-{0}', github.sha) }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2

        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Docker Compose

        uses: azure/webapps-deploy@v3

        with:

          app-name: ${{ vars.APP_NAME }}

          multicontainer-config-file: docker-compose.yml

          multicontainer-config-type: compose