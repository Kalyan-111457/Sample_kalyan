name: Container Build Azure

on:
  workflow_call:

    inputs:

      ENVIRONMENT:
        description: GitHub Environment
        required: true
        type: string

      BUILD_CONTEXT:
        description: JSON array containing docker build details
        required: true
        type: string

      TAG_NAME:
        description: Docker image tag
        required: true
        type: string

jobs:

  prep-matrix:

    name: Prepare Matrix

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:

      - id: set-matrix
        run: |
          echo 'matrix={"include":[{"path":".","image":"api","dockerfile":"Dockerfile.api"},{"path":".","image":"web","dockerfile":"Dockerfile.web"}]}' >> $GITHUB_OUTPUT

  build-and-publish:

    name: Build and Publish Docker Images

    runs-on: ubuntu-latest

    needs: [prep-matrix]

    strategy:
      matrix: ${{ fromJson(needs.prep-matrix.outputs.matrix) }}

    environment: ${{ inputs.ENVIRONMENT }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker Image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t ${{ vars.ACR_URL }}/${{ matrix.image }}:${{ inputs.TAG_NAME }} \
            ${{ matrix.path }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ vars.ACR_URL }}/${{ matrix.image }}:${{ inputs.TAG_NAME }}